lxc.uts.name = vegas26-k3s-lxc
lxc.rootfs.path = dir:/var/lib/vegas26-k3s-storage/lxc/k3s/rootfs
lxc.init.cmd = /lib/systemd/systemd
lxc.mount.auto = proc:mixed sys:ro cgroup:rw
lxc.autodev = 1
lxc.pty.max = 0
lxc.tty.max = 0
lxc.net.0.type = none
lxc.cgroup.dir.monitor = k3s/lxc-monitor
lxc.cgroup.dir.container = k3s/lxc-payload
lxc.mount.entry = /dev/kmsg dev/kmsg none bind,create=file 0 0
lxc.mount.entry = /sys/fs/bpf sys/fs/bpf none bind,ro,create=dir 0 0
lxc.mount.entry = /var/lib/vegas26-k3s-storage/rancher var/lib/rancher none bind,create=dir 0 0
lxc.mount.entry = /var/lib/vegas26-k3s-storage/containerd var/lib/containerd none bind,create=dir 0 0
